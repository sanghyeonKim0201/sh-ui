name: CI

on:
  pull_request:
    branches: [live, dev]
  push:
    branches: [dev, live]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (packages — 있는 것만)
        run: pnpm -r --if-present test

      - name: Typecheck docs
        run: pnpm --filter @sh-ui/docs typecheck

      - name: Lint — registry/summary 정합성 + 듀얼카피 drift
        run: pnpm lint:drift
