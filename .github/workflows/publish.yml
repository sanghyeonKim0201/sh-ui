name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publisher OIDC + provenance
    strategy:
      fail-fast: false
      matrix:
        package: [cli]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # live 와 ancestor 비교에 full history 필요

      - name: Verify tag is on live
        run: |
          git fetch origin live --no-tags
          if ! git merge-base --is-ancestor HEAD origin/live; then
            echo "::error::태그 ${GITHUB_REF#refs/tags/} 가 live 에 없는 커밋을 가리킵니다. live 머지 후 live 에서 태그를 찍어주세요."
            exit 1
          fi

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # 태그 버전과 package.json version 이 어긋나면 아래 "Check if already published"
      # 의 스킵 로직이 드리프트를 조용히 삼켜 게시가 누락된다. 여기서 시끄럽게 실패시킨다.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/${{ matrix.package }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::태그 v$TAG 와 packages/${{ matrix.package }}/package.json version ($PKG) 이 다릅니다. 릴리즈 전에 package.json version 을 범프하세요."
            exit 1
          fi
          echo "✔ 태그 v$TAG = packages/${{ matrix.package }}/package.json $PKG"

      # Trusted Publishing (OIDC) 은 npm 11.5.1+ 필요. Node 20 기본 npm 은 10.x.
      # npm@latest(12+)는 Node 20 을 드롭했으므로, Node 20 호환이면서 OIDC 를
      # 지원하는 11.x 최신으로 핀한다.
      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (if script exists)
        working-directory: packages/${{ matrix.package }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "No test script in packages/${{ matrix.package }} — skipping"
          fi

      # 실제 스캐폴드 + 타입체크 게이트.
      # smoke.test.js (단위) 는 파일 구조만 검증 — 여기서는 fresh install + tsc 까지
      # 돌려서 템플릿 자체가 사용자 환경에서도 빌드 가능한지 확인한다.
      - name: Smoke - scaffold matrix + typecheck
        if: matrix.package == 'cli'
        run: |
          set -e
          MATRIX=(
            "bare:--platform next --structure standalone"
            "next-intl:--platform next --structure standalone --plugins next-intl"
          )
          for entry in "${MATRIX[@]}"; do
            label="${entry%%:*}"
            args="${entry#*:}"
            echo "::group::Smoke [$label] $args"
            target="/tmp/smoke-$label"
            rm -rf "$target"
            (cd /tmp && node "$GITHUB_WORKSPACE/packages/cli/bin/sh-ui.mjs" create "smoke-$label" $args --yes)
            (cd "$target" && pnpm install --ignore-workspace --no-frozen-lockfile && pnpm tsc --noEmit)
            echo "::endgroup::"
          done

      - name: Check if already published
        id: check
        working-directory: packages/${{ matrix.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✔ $NAME@$VERSION already on registry — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "→ Will publish $NAME@$VERSION"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/${{ matrix.package }}
        # npm CLI 가 OIDC Trusted Publisher flow 를 네이티브로 지원. pnpm publish 는
        # provenance 서명만 전달하고 레지스트리 auth 는 .npmrc 에 맡기는 것으로 보임 →
        # NPM_TOKEN 없는 OIDC 환경에서 PUT 401 을 404 로 받음. npm 으로 직접.
        run: npm publish --provenance --access public
